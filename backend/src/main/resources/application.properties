spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/taskboard
spring.datasource.username=taskboard
spring.datasource.password=taskboard

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# data.sqlはPostgreSQL(非組み込みDB)でも常に実行する
spring.sql.init.mode=always
# ddl-autoによるテーブル作成後にdata.sqlを実行する(順序を保証しないとテーブル未作成でエラーになる)
spring.jpa.defer-datasource-initialization=true
