<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タスクボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>タスクボード</h1>

  <div class="board">
    <section class="list" data-list-id="todo">
      <h2>未着手</h2>
      <div class="cards" id="cards-todo"></div>
      <form class="add-card-form" data-list-id="todo">
        <input type="text" placeholder="カードを追加" required>
        <button type="submit">追加</button>
      </form>
    </section>

    <section class="list" data-list-id="doing">
      <h2>作業中</h2>
      <div class="cards" id="cards-doing"></div>
      <form class="add-card-form" data-list-id="doing">
        <input type="text" placeholder="カードを追加" required>
        <button type="submit">追加</button>
      </form>
    </section>

    <section class="list" data-list-id="done">
      <h2>完了</h2>
      <div class="cards" id="cards-done"></div>
      <form class="add-card-form" data-list-id="done">
        <input type="text" placeholder="カードを追加" required>
        <button type="submit">追加</button>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
